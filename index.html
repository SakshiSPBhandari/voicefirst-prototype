<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>VoiceFirst – ChatGPT Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Phone Frame Wrapper -->
  <div class="phone-frame">
    <div class="phone-screen">

      <!-- Status Bar -->
      <div class="status-bar">
        <span class="status-time" id="statusTime">9:41</span>
        <div class="status-icons">
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0.5" width="3" height="11.5" rx="1"/><rect x="13.5" y="0" width="2.5" height="12" rx="1" opacity="0.3"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.5C10.5 2.5 12.7 3.6 14.2 5.3L15.5 3.9C13.6 1.8 11 0.5 8 0.5C5 0.5 2.4 1.8 0.5 3.9L1.8 5.3C3.3 3.6 5.5 2.5 8 2.5Z"/><path d="M8 5.5C9.8 5.5 11.4 6.3 12.5 7.6L13.8 6.2C12.3 4.5 10.3 3.5 8 3.5C5.7 3.5 3.7 4.5 2.2 6.2L3.5 7.6C4.6 6.3 6.2 5.5 8 5.5Z"/><circle cx="8" cy="10" r="2"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="1" width="22" height="10" rx="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="22.5" y="3.5" width="2" height="5" rx="1"/><rect x="1" y="2" width="18" height="8" rx="1.5"/></svg>
        </div>
      </div>

      <!-- Top Bar -->
      <header class="app-header">
        <button class="header-icon-btn" id="sidebarBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="app-title-wrap">
          <span class="app-title">ChatGPT</span>
          <div class="model-chip">4o <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
        <button class="header-icon-btn" id="editBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
      </header>

      <!-- Chat Area -->
      <section class="chat-area" id="chatArea">

        <!-- Welcome State -->
        <div class="welcome-state" id="welcomeState">
          <div class="gpt-orb" id="gptOrb">
            <div class="orb-ring"></div>
            <div class="orb-core">
              <svg width="28" height="28" viewBox="0 0 41 41" fill="none">
                <path d="M37.532 16.87a9.963 9.963 0 0 0-.856-8.184 10.078 10.078 0 0 0-10.855-4.835A9.964 9.964 0 0 0 18.306.5a10.079 10.079 0 0 0-9.614 6.977 9.967 9.967 0 0 0-6.664 4.834 10.08 10.08 0 0 0 1.24 11.817 9.965 9.965 0 0 0 .856 8.185 10.079 10.079 0 0 0 10.855 4.835 9.965 9.965 0 0 0 7.516 3.35 10.078 10.078 0 0 0 9.617-6.981 9.967 9.967 0 0 0 6.663-4.834 10.079 10.079 0 0 0-1.243-11.813z" fill="white"/>
              </svg>
            </div>
          </div>
          <h2 class="welcome-greeting">Good evening, Sakshi</h2>
          <p class="welcome-sub">How can I help you today?</p>
          <div class="suggestion-pills">
            <button class="pill" onclick="insertExample('Brainstorm content ideas for my portfolio')">✍️ Brainstorm ideas</button>
            <button class="pill" onclick="insertExample('Explain machine learning simply')">🧠 Explain ML</button>
            <button class="pill" onclick="insertExample('Help me write an email to my manager')">📧 Write email</button>
            <button class="pill" onclick="insertExample('Review my resume for a PM role')">📄 Review resume</button>
          </div>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>

      </section>

      <!-- Input Area -->
      <footer class="input-area">
        <div class="input-row">
          <div class="input-box" id="inputBox">
            <textarea id="msgInput" placeholder="Message" rows="1" autocomplete="off"></textarea>
            <button class="voice-btn" id="voiceBtn" title="Voice input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
          </div>
          <button class="send-fab" id="sendBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">VoiceFirst Prototype · Milestone 3</div>
      </footer>

    </div><!-- /phone-screen -->
  </div><!-- /phone-frame -->

  <!-- ══════ OVERLAYS ══════ -->

  <!-- Backdrop -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Voice Input Bottom Sheet (2 options) -->
  <div class="bottom-sheet" id="voiceSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Voice Input</div>
    <p class="sheet-sub">How would you like to add your voice message?</p>
    <div class="voice-options">
      <button class="voice-option" id="optionSpeak">
        <div class="vo-icon" style="background:linear-gradient(135deg,#a78bfa,#7c3aed)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <div class="vo-text">
          <div class="vo-title">Speak</div>
          <div class="vo-desc">Transcript appears word-by-word as you talk</div>
        </div>
        <svg class="vo-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="voice-option" id="optionUpload">
        <div class="vo-icon" style="background:linear-gradient(135deg,#38bdf8,#0284c7)">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div class="vo-text">
          <div class="vo-title">Upload Audio</div>
          <div class="vo-desc">Upload an MP3 or WAV recording</div>
        </div>
        <svg class="vo-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <button class="sheet-cancel" id="sheetCancel">Cancel</button>
  </div>

  <!-- Live Recording Sheet -->
  <div class="bottom-sheet recording-sheet" id="recordingSheet">
    <div class="sheet-handle"></div>

    <div class="rec-header">
      <div class="rec-dot" id="recDot"></div>
      <span class="rec-label" id="recLabel">Listening…</span>
      <button class="rec-x" id="recClose">✕</button>
    </div>

    <!-- Live Waveform Bars -->
    <div class="waveform" id="waveform">
      <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
      <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
      <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
      <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
      <div class="wv-bar"></div><div class="wv-bar"></div><div class="wv-bar"></div>
    </div>

    <!-- Transcript box: words appear word by word here -->
    <div class="transcript-box" id="transcriptBox">
      <span class="transcript-placeholder" id="transcriptPlaceholder">Start speaking — words will appear here…</span>
      <span class="transcript-final" id="transcriptFinal"></span><span class="transcript-interim" id="transcriptInterim"></span>
    </div>

    <div class="rec-actions">
      <button class="rec-cancel-btn" id="recCancel">Cancel</button>
      <button class="rec-send-btn" id="recSend" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        Send
      </button>
    </div>
  </div>

  <!-- Audio Upload Processing Sheet -->
  <div class="bottom-sheet upload-sheet" id="uploadSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Processing Audio</div>
    <div class="upload-visual">
      <div class="upload-orb" id="uploadOrb">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="upload-file-name" id="uploadFileName">audio.mp3</div>
    </div>
    <div class="upload-progress-wrap">
      <div class="upload-progress-bar" id="uploadProgressBar"></div>
    </div>
    <div class="upload-status" id="uploadStatus">Analyzing audio…</div>
    <button class="sheet-cancel" id="uploadCancel">Cancel</button>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="audioFileInput" accept="audio/*,.mp3,.wav,.m4a,.ogg" style="display:none"/>

  <script src="app.js"></script>
</body>
</html>
